<!DOCTYPE html>
<html lang="es" prefix="og: https://ogp.me/ns#">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width">

    <title>Experiencia 04 - Metadata</title>

    <meta name="description"
          content="Página de ejemplo sobre el uso de metadatos en HTML5.">

    <!-- Open Graph -->
    <meta property="og:title"
          content="Experiencia 04 - Metadata">

    <meta property="og:type"
          content="website">

    <meta property="og:image"
          content="https://joshua8801.github.io/Desarrollo-de-Aplicacion/practica-01/experiencias/experiencia-04-metadata/imagen-metadata.jpg">

    <meta property="og:url"
          content="https://joshua8801.github.io/Desarrollo-de-Aplicacion/practica-01/experiencias/experiencia-04-metadata/">

    <meta property="og:description"
          content="Ejemplo del uso de Metadata, Open Graph y Twitter Cards.">

    <!-- Twitter Card -->
    <meta name="twitter:card"
          content="summary_large_image">

    <meta name="twitter:title"
          content="Experiencia 04 - Metadata">

    <meta name="twitter:description"
          content="Ejemplo del uso de Metadata, Open Graph y Twitter Cards.">

    <meta name="twitter:image"
          content="https://joshua8801.github.io/Desarrollo-de-Aplicacion/practica-01/experiencias/experiencia-04-metadata/imagen-metadata.jpg">
</head>

<body>
    <h1>Ejemplo de Metadata en HTML</h1>

    <p>
        El contenido de title aparece en la pestaña del navegador,
        mientras que el contenido de h1 aparece dentro de la página.
    </p>

    <p>
        <a href="charset-iso.html">
            Ver ejemplo de codificación ISO-8859-1
        </a>
    </p>
</body>
</html>
